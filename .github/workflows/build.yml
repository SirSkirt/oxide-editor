name: Verify Rivet build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows x64 verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./updater/src-tauri -> target
      - name: Install frontend dependencies
        run: npm install
      - name: Validate Semantic Readability contrast
        run: npm run validate:themes
      - name: Validate Settings and adaptive layouts
        run: npm run validate:layout
      - name: Build and stage updater helper
        run: npm run prepare:updater
      - name: Build frontend
        run: npm run build
      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

  linux-build:
    name: Linux x64 verification (Ubuntu 22.04 / Pop!_OS baseline)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./linux-updater -> target
      - name: Install frontend dependencies
        run: npm install
      - name: Validate Semantic Readability contrast
        run: npm run validate:themes
      - name: Validate Settings and adaptive layouts
        run: npm run validate:layout
      - name: Build and stage Linux updater helper
        run: npm run prepare:updater
      - name: Build frontend
        run: npm run build
      - name: Check Linux Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

  android-build:
    name: Android ARM64 editor-preview verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Configure Android SDK/NDK environment
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(command -v sdkmanager)"
          test -n "$sdkmanager_path" && test -x "$sdkmanager_path"

          # setup-android places sdkmanager under <sdk>/cmdline-tools/<version>/bin.
          # Derive the SDK root from the executable we will actually use instead
          # of trusting a stale runner-level ANDROID_HOME value.
          sdk_root="$(cd "$(dirname "$sdkmanager_path")/../../.." && pwd)"
          ndk_home="$sdk_root/ndk/28.2.13676358"
          test -d "$ndk_home"

          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "Android SDK: $sdk_root"
          echo "Android NDK: $ndk_home"
          sdkmanager --version
      - name: Install frontend dependencies
        run: npm install
      - name: Validate Semantic Readability contrast
        run: npm run validate:themes
      - name: Validate Settings and adaptive layouts
        run: npm run validate:layout
      - name: Validate isolated Android preview architecture
        run: npm run validate:mobile
      - name: Initialize Tauri Android project
        run: npm run tauri android init
      - name: Build Android ARM64 preview APK
        run: npm run tauri android build -- --apk --target aarch64 --debug
      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$apk" && test -f "$apk"
          echo "Built Android preview: $apk"
