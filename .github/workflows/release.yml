name: Build and publish Rivet

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      display: ${{ steps.version.outputs.display }}
      build: ${{ steps.version.outputs.build }}
      updater_version: ${{ steps.version.outputs.updater_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate Semantic Readability contrast
        run: npm run validate:themes
      - name: Validate Settings and adaptive layouts
        run: npm run validate:layout

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DISPLAY=$(node -p "require('./package.json').displayVersion")
          BUILD=$(node -p "require('./package.json').buildNumber || 1")
          UPDATER_VERSION=$(node -p "(()=>{const p=require('./package.json'); const v=p.version.split('.').map(Number); return v[0]+'.'+v[1]+'.'+(v[2]*10000+Number(p.buildNumber||1));})()")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "display=$DISPLAY" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "updater_version=$UPDATER_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-b$BUILD" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OXIDE_TAG: ${{ steps.version.outputs.tag }}
          OXIDE_DISPLAY_VERSION: ${{ steps.version.outputs.display }}
          OXIDE_BUILD: ${{ steps.version.outputs.build }}
        run: |
          if gh release view "$OXIDE_TAG" >/dev/null 2>&1; then
            if [ -f RELEASE_NOTES.md ]; then
              gh release edit "$OXIDE_TAG" --title "Rivet $OXIDE_DISPLAY_VERSION Build $OXIDE_BUILD" --notes-file RELEASE_NOTES.md
            else
              gh release edit "$OXIDE_TAG" --title "Rivet $OXIDE_DISPLAY_VERSION Build $OXIDE_BUILD" --notes "Rivet $OXIDE_DISPLAY_VERSION Build $OXIDE_BUILD"
            fi
          else
            if [ -f RELEASE_NOTES.md ]; then
              gh release create "$OXIDE_TAG" --draft --title "Rivet $OXIDE_DISPLAY_VERSION Build $OXIDE_BUILD" --notes-file RELEASE_NOTES.md
            else
              gh release create "$OXIDE_TAG" --draft --title "Rivet $OXIDE_DISPLAY_VERSION Build $OXIDE_BUILD" --notes "Rivet $OXIDE_DISPLAY_VERSION Build $OXIDE_BUILD"
            fi
          fi

  windows-release:
    name: Windows x64 release
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./updater/src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Verify signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($config.plugins.updater.pubkey -eq 'OXIDE_UPDATER_PUBLIC_KEY_NOT_CONFIGURED') {
            throw 'Updater public key is not configured.'
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Missing TAURI_SIGNING_PRIVATE_KEY repository secret.'
          }

      - name: Build and stage Windows Update Service
        run: npm run prepare:updater

      - name: Build Rivet NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Create signed Windows Rivet package
        id: package
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OXIDE_VERSION: ${{ needs.prepare-release.outputs.version }}
          OXIDE_DISPLAY_VERSION: ${{ needs.prepare-release.outputs.display }}
          OXIDE_BUILD: ${{ needs.prepare-release.outputs.build }}
          OXIDE_UPDATER_VERSION: ${{ needs.prepare-release.outputs.updater_version }}
          OXIDE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $PWD 'release-assets'
          $stageDir = Join-Path $releaseDir 'update-package-windows'
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          $editorExe = Join-Path $PWD 'src-tauri\target\release\oxide-editor.exe'
          $updaterExe = Join-Path $PWD 'updater\src-tauri\target\release\oxide-updater.exe'
          if (-not (Test-Path $editorExe)) { throw "Missing built editor executable: $editorExe" }
          if (-not (Test-Path $updaterExe)) { throw "Missing built updater executable: $updaterExe" }

          Copy-Item $editorExe (Join-Path $stageDir 'oxide-editor.exe')
          Copy-Item $updaterExe (Join-Path $stageDir 'oxide-updater.exe')

          $packageManifest = [ordered]@{
            format = 1
            version = $env:OXIDE_UPDATER_VERSION
            release_version = $env:OXIDE_VERSION
            display_version = $env:OXIDE_DISPLAY_VERSION
            build = [int]$env:OXIDE_BUILD
            platform = 'windows-x86_64'
            files = @('oxide-editor.exe', 'oxide-updater.exe')
          } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText(
            (Join-Path $stageDir 'update-package.json'),
            $packageManifest,
            (New-Object System.Text.UTF8Encoding($false))
          )

          $assetName = "oxide-update-windows-x86_64-$($env:OXIDE_VERSION)-b$($env:OXIDE_BUILD).zip"
          $packagePath = Join-Path $releaseDir $assetName
          if (Test-Path $packagePath) { Remove-Item $packagePath -Force }
          Compress-Archive -Path (Join-Path $stageDir '*') -DestinationPath $packagePath -CompressionLevel Optimal

          npm.cmd run tauri -- signer sign $packagePath
          if ($LASTEXITCODE -ne 0) { throw "Tauri signer failed with exit code $LASTEXITCODE" }
          $signaturePath = "$packagePath.sig"
          $signature = (Get-Content $signaturePath -Raw).Trim()
          $sha256 = (Get-FileHash $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$($env:OXIDE_TAG)/$assetName"
          $notes = if (Test-Path 'RELEASE_NOTES.md') { (Get-Content 'RELEASE_NOTES.md' -Raw).Trim() } else { "Rivet $($env:OXIDE_DISPLAY_VERSION)" }

          $latest = [ordered]@{
            version = $env:OXIDE_UPDATER_VERSION
            release_version = $env:OXIDE_VERSION
            display_version = $env:OXIDE_DISPLAY_VERSION
            build = [int]$env:OXIDE_BUILD
            notes = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            url = $downloadUrl
            signature = $signature
            sha256 = $sha256
          } | ConvertTo-Json -Depth 8
          $latestPath = Join-Path $releaseDir 'oxide-latest-windows-x86_64.json'
          [System.IO.File]::WriteAllText($latestPath, $latest, (New-Object System.Text.UTF8Encoding($false)))

          # Build numbers are part of Rivet's release identity. Fail the release
          # instead of publishing a feed that would make Build N invisible to Build N-1.
          $feedCheck = Get-Content $latestPath -Raw | ConvertFrom-Json
          if ($feedCheck.release_version -ne $env:OXIDE_VERSION -or [int]$feedCheck.build -ne [int]$env:OXIDE_BUILD) {
            throw "Windows updater feed identity mismatch: expected $($env:OXIDE_VERSION) Build $($env:OXIDE_BUILD)"
          }

          $installer = Get-ChildItem 'src-tauri\target\release\bundle\nsis\*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The NSIS installer was not produced.' }
          $installerSignaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $installerSignaturePath)) { throw "The signed NSIS updater signature was not produced: $installerSignaturePath" }
          $installerSignature = (Get-Content $installerSignaturePath -Raw).Trim()
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/$($env:OXIDE_TAG)/$($installer.Name)"

          # Legacy bridge for B1.3.1 and older Windows updater-enabled builds.
          $legacyLatest = [ordered]@{
            version = $env:OXIDE_UPDATER_VERSION
            notes = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            url = $installerUrl
            signature = $installerSignature
          } | ConvertTo-Json -Depth 8
          $legacyLatestPath = Join-Path $releaseDir 'latest.json'
          [System.IO.File]::WriteAllText($legacyLatestPath, $legacyLatest, (New-Object System.Text.UTF8Encoding($false)))

          "package=$packagePath" >> $env:GITHUB_OUTPUT
          "signature=$signaturePath" >> $env:GITHUB_OUTPUT
          "latest=$latestPath" >> $env:GITHUB_OUTPUT
          "legacyLatest=$legacyLatestPath" >> $env:GITHUB_OUTPUT
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "installerSignature=$installerSignaturePath" >> $env:GITHUB_OUTPUT

      - name: Upload Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OXIDE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          gh release upload $env:OXIDE_TAG `
            "${{ steps.package.outputs.installer }}" `
            "${{ steps.package.outputs.package }}" `
            "${{ steps.package.outputs.signature }}" `
            "${{ steps.package.outputs.latest }}" `
            "${{ steps.package.outputs.legacyLatest }}" `
            "${{ steps.package.outputs.installerSignature }}" `
            --clobber

      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: oxide-windows-x64-${{ needs.prepare-release.outputs.version }}-b${{ needs.prepare-release.outputs.build }}
          path: |
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.package }}
            ${{ steps.package.outputs.signature }}
            ${{ steps.package.outputs.latest }}
            ${{ steps.package.outputs.legacyLatest }}

  linux-release:
    name: Linux x64 release (Ubuntu / Pop!_OS)
    needs: prepare-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./linux-updater -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Verify signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e "const c=require('./src-tauri/tauri.conf.json'); if(c.plugins.updater.pubkey==='OXIDE_UPDATER_PUBLIC_KEY_NOT_CONFIGURED') process.exit(2)"
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || (echo 'Missing TAURI_SIGNING_PRIVATE_KEY repository secret.' && exit 3)

      - name: Build and stage Linux Update Service
        run: npm run prepare:updater

      - name: Build Rivet .deb and AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles deb,appimage --config src-tauri/tauri.release.conf.json

      - name: Add Oxide-to-Rivet Debian migration metadata
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | head -n 1)
          test -n "$deb" && test -f "$deb"
          bash ./scripts/patch-deb-migration.sh "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "rivet"
          test "$(dpkg-deb -f "$deb" Replaces)" = "oxide-editor"
          test "$(dpkg-deb -f "$deb" Conflicts)" = "oxide-editor"

      - name: Create signed Linux update package
        id: package
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OXIDE_VERSION: ${{ needs.prepare-release.outputs.version }}
          OXIDE_DISPLAY_VERSION: ${{ needs.prepare-release.outputs.display }}
          OXIDE_BUILD: ${{ needs.prepare-release.outputs.build }}
          OXIDE_UPDATER_VERSION: ${{ needs.prepare-release.outputs.updater_version }}
          OXIDE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          release_dir="$PWD/release-assets-linux"
          stage_dir="$release_dir/update-package-linux"
          mkdir -p "$stage_dir"

          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n 1)
          deb=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | head -n 1)
          test -n "$appimage" && test -f "$appimage"
          test -n "$deb" && test -f "$deb"

          cp "$appimage" "$stage_dir/oxide-editor.AppImage"
          chmod +x "$stage_dir/oxide-editor.AppImage"
          cp "$deb" "$stage_dir/oxide-editor.deb"
          cat > "$stage_dir/update-package.json" <<JSON
          {
            "format": 1,
            "version": "$OXIDE_UPDATER_VERSION",
            "release_version": "$OXIDE_VERSION",
            "display_version": "$OXIDE_DISPLAY_VERSION",
            "build": $OXIDE_BUILD,
            "platform": "linux-x86_64",
            "files": ["oxide-editor.AppImage", "oxide-editor.deb"]
          }
          JSON

          asset_name="oxide-update-linux-x86_64-$OXIDE_VERSION-b$OXIDE_BUILD.zip"
          package_path="$release_dir/$asset_name"
          python3 - "$stage_dir" "$package_path" <<'PY'
          import os, sys, zipfile
          stage, output = sys.argv[1:]
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as z:
              for name in sorted(os.listdir(stage)):
                  z.write(os.path.join(stage, name), arcname=name)
          PY

          npm run tauri -- signer sign "$package_path"
          signature_path="$package_path.sig"
          signature=$(cat "$signature_path" | tr -d '\r\n')
          sha256=$(sha256sum "$package_path" | awk '{print $1}')
          download_url="https://github.com/${{ github.repository }}/releases/download/$OXIDE_TAG/$asset_name"
          notes=$(cat RELEASE_NOTES.md 2>/dev/null || printf 'Rivet %s' "$OXIDE_DISPLAY_VERSION")
          latest_path="$release_dir/oxide-latest-linux-x86_64.json"
          python3 - "$latest_path" "$OXIDE_UPDATER_VERSION" "$OXIDE_VERSION" "$OXIDE_DISPLAY_VERSION" "$OXIDE_BUILD" "$download_url" "$signature" "$sha256" "$notes" <<'PY'
          import datetime, json, sys
          path, updater_version, release_version, display, build, url, signature, sha256, notes = sys.argv[1:]
          payload = {
              'version': updater_version,
              'release_version': release_version,
              'display_version': display,
              'build': int(build),
              'notes': notes,
              'pub_date': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'url': url,
              'signature': signature,
              'sha256': sha256,
          }
          with open(path, 'w', encoding='utf-8', newline='\n') as f:
              json.dump(payload, f, indent=2)
              f.write('\n')
          PY

          # Validate the build-aware feed before it can be uploaded.
          python3 - "$latest_path" "$OXIDE_VERSION" "$OXIDE_BUILD" <<'PY'
          import json, sys
          path, expected_version, expected_build = sys.argv[1:]
          with open(path, encoding='utf-8') as handle:
              feed = json.load(handle)
          if feed.get('release_version') != expected_version or int(feed.get('build', 0)) != int(expected_build):
              raise SystemExit(f"Linux updater feed identity mismatch: expected {expected_version} Build {expected_build}")
          PY

          echo "package=$package_path" >> "$GITHUB_OUTPUT"
          echo "signature=$signature_path" >> "$GITHUB_OUTPUT"
          echo "latest=$latest_path" >> "$GITHUB_OUTPUT"
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"

      - name: Upload Linux release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OXIDE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          gh release upload "$OXIDE_TAG" \
            "${{ steps.package.outputs.deb }}" \
            "${{ steps.package.outputs.appimage }}" \
            "${{ steps.package.outputs.package }}" \
            "${{ steps.package.outputs.signature }}" \
            "${{ steps.package.outputs.latest }}" \
            --clobber

      - name: Upload Linux workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: oxide-linux-x64-${{ needs.prepare-release.outputs.version }}-b${{ needs.prepare-release.outputs.build }}
          path: |
            ${{ steps.package.outputs.deb }}
            ${{ steps.package.outputs.appimage }}
            ${{ steps.package.outputs.package }}
            ${{ steps.package.outputs.signature }}
            ${{ steps.package.outputs.latest }}


  android-release:
    name: Android ARM64 editor preview
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Configure Android SDK/NDK environment
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(command -v sdkmanager)"
          test -n "$sdkmanager_path" && test -x "$sdkmanager_path"

          # setup-android places sdkmanager under <sdk>/cmdline-tools/<version>/bin.
          # Derive the SDK root from the executable we will actually use instead
          # of trusting a stale runner-level ANDROID_HOME value.
          sdk_root="$(cd "$(dirname "$sdkmanager_path")/../../.." && pwd)"
          ndk_home="$sdk_root/ndk/28.2.13676358"
          test -d "$ndk_home"

          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "Android SDK: $sdk_root"
          echo "Android NDK: $ndk_home"
          sdkmanager --version

      - name: Install frontend dependencies
        run: npm install

      - name: Validate Android preview architecture
        run: npm run validate:mobile

      - name: Initialize Tauri Android project
        run: npm run tauri android init

      - name: Build installable Android preview APK
        run: npm run tauri android build -- --apk --target aarch64 --debug

      - name: Stage Android preview APK
        id: apk
        shell: bash
        env:
          RIVET_VERSION: ${{ needs.prepare-release.outputs.version }}
          RIVET_BUILD: ${{ needs.prepare-release.outputs.build }}
        run: |
          set -euo pipefail
          source_apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$source_apk" && test -f "$source_apk"
          mkdir -p release-assets-android
          output="release-assets-android/Rivet-Android-Preview-$RIVET_VERSION-b$RIVET_BUILD-arm64.apk"
          cp "$source_apk" "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RIVET_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$RIVET_TAG" "${{ steps.apk.outputs.path }}" --clobber

      - name: Upload Android workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: rivet-android-preview-arm64-${{ needs.prepare-release.outputs.version }}-b${{ needs.prepare-release.outputs.build }}
          path: ${{ steps.apk.outputs.path }}


  publish-release:
    name: Publish completed Rivet release
    needs: [prepare-release, windows-release, linux-release, android-release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release after desktop feeds and Android preview are ready
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OXIDE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          gh release edit "$OXIDE_TAG" --draft=false --latest
