[package]
name = "oxide-editor"
version = "1.3.6"
description = "Rivet - a Rust-first Cargo workbench"
authors = ["Rivet contributors"]
edition = "2021"

[lib]
name = "oxide_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
toml_edit = "0.25"
semver = "1"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-updater = "2.10.1"
